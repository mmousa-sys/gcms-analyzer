================================================================================
HTML-BASED WEB APPLICATION FOR GC-MS ESSENTIAL OIL ANALYSIS:
RETENTION INDEX CALCULATION, COMPOUND IDENTIFICATION,
AND QUANTITATIVE VERIFICATION
================================================================================

Author : Mohammad Asad Mohammad Abdel Qader (Mousa)
Role   : Chemical Laboratory Technician
File   : GCMS_Analyzer.html (single-file browser application)
SOP DOI: 10.13140/RG.2.2.23821.40169

Keywords: GC-MS; Kovats Retention Index; Essential oils; Compound
identification; Van den Dool & Kratz; Adams database; NIST;
Web application; HTML/JavaScript; SOP.

--------------------------------------------------------------------------------
ABSTRACT
--------------------------------------------------------------------------------
A single-file, browser-based HTML/JavaScript application was developed to
support the routine interpretation of GC-MS data of essential oils. The tool
integrates (i) Kovats Retention Index (KRI) calculation from an alkane standard
using the Van den Dool & Kratz equation, (ii) automated compound identification
by matching calculated KRI against a 780+ compound reference database (Adams
2017, Babushok 2011, NIST), (iii) area-percent quantification with optional
exclusion of solvent and high-boiling artifacts, (iv) generation of a
formatted analytical report, and (v) an embedded Standard Operating Procedure
(SOP) summary linked to the published ResearchGate SOP
(DOI: 10.13140/RG.2.2.23821.40169).

--------------------------------------------------------------------------------
1. INTRODUCTION
--------------------------------------------------------------------------------
Identification of volatile constituents in essential oils by GC-MS relies on
two orthogonal criteria: mass-spectral match and retention-index agreement on
a known stationary phase. While mass-spectral libraries (NIST, Wiley) are
widely available, retention-index verification is often the decisive step
that separates true positives from isobaric or co-eluting interferences.

The present application was written to make this verification step fast,
reproducible, and transparent. It is a self-contained HTML file (no server,
no dependencies, no installation) that any analyst can open in a browser and
use directly at the bench.

--------------------------------------------------------------------------------
2. SCIENTIFIC BASIS
--------------------------------------------------------------------------------
2.1 Retention Index (Kovats / Van den Dool & Kratz)
    KRI = 100*C1 + 100*(C2 - C1)*((tR - t1)/(t2 - t1))

2.2 Match score and acceptance criteria
    Match % = 100 - 2 * |KRI_calc - KRI_ref|
    Identified  -- Match >= 80 % AND |delta KRI| <= 10
    Tentative   -- Match >= 60 % AND |delta KRI| <= 20
    Unknown     -- otherwise

2.3 Reference database
    780+ entries in the format:
    [Name, CAS, Formula, KRI(DB-1), KRI(DB-5), KRI(PEG), KRI(Adams)]

--------------------------------------------------------------------------------
3. APPLICATION FEATURES
--------------------------------------------------------------------------------
  Alkane standard     - C8-C28 retention times (Artemisia sample)
  KRI calculator      - Single-RT and batch, with bracketing alkanes
  Identification      - RT -> KRI -> auto lookup + best-column match
  Database search     - By name, CAS, or synonym
  Quantification      - Area-% with solvent/high-boiler exclusion
  Report              - Conditions, alkane table, KRI, Match %, area-%
  SOP tab             - Embedded SOP summary + ResearchGate link
  Description tab     - Downloadable .txt
  Multilingual        - Arabic, English, German (RTL/LTR)

--------------------------------------------------------------------------------
4. WORKFLOW
--------------------------------------------------------------------------------
  1. Load alkane standard (C8-C28). Save.
  2. Run sample under identical GC conditions.
  3. Enter each peak RT -> KRI computed automatically.
  4. Auto-match against 4 column sets (DB-1, DB-5, PEG, Adams).
  5. Quantify by peak area (area-%).
  6. Generate report (.txt save or clipboard copy).

--------------------------------------------------------------------------------
5. VERIFICATION OF RESULTS
--------------------------------------------------------------------------------
  * Bracketing transparency - displays the two bracketing alkanes.
  * Column-aware matching - all four reference columns compared.
  * Two-criterion acceptance - Match >= 80 % AND |delta KRI| <= 10.
  * Synonym resolution.
  * Quantification exclusion toggles.
  * Full report for independent recomputation.

--------------------------------------------------------------------------------
6. VALIDATION PRACTICE
--------------------------------------------------------------------------------
  * Run a known standard mixture.
  * Verify monotonic alkane RTs; out-of-range rejected.
  * Keep method identical between alkane run and sample run.
  * Report reference column and Match % in publications.

--------------------------------------------------------------------------------
7. LIMITATIONS
--------------------------------------------------------------------------------
  * First-order linear interpolation.
  * Not exhaustive; novel/minor compounds may appear as Unknown.
  * Area-% is semi-quantitative.
  * An aid, not a substitute for expert spectral interpretation.

--------------------------------------------------------------------------------
8. STANDARD OPERATING PROCEDURE (SOP) v3.0
--------------------------------------------------------------------------------
  Title        : STANDARD OPERATING PROCEDURE (SOP) of Essential Oils by
                 Gas Chromatography-Mass Spectrometry (GC-MS), including
                 Kovats Retention Index (KRI) calculation and compound
                 identification
  Version      : 3.0
  Effective    : 22 May 2026
  Author       : Mohammad Asad Mohammad Abdel Qader (Mousa)
  Institution  : The Pharmaceutical Automated Analysis Laboratory
  Published    : May 2026
  DOI          : 10.13140/RG.2.2.23821.40169
  Access       : https://doi.org/10.13140/RG.2.2.23821.40169

  SOP Contents
  1. Sample and standard preparation
  2. GC-MS operating conditions
  3. Alkane standard injection
  4. KRI calculation (Van den Dool & Kratz)
  5. Compound identification by Match %
  6. Quantification (Area-%)
  7. Final report writing
  8. References (Adams 2017, Babushok 2011, NIST)

  This SOP is periodically updated. Always check the latest version on
  ResearchGate.

--------------------------------------------------------------------------------
9. REFERENCES
--------------------------------------------------------------------------------

const DESCRIPTION_TEXT = (document.getElementById("descTxt")||{textContent:""}).textContent || "";
function downloadDescription(){
  const text = DESCRIPTION_TEXT.trim() + "\n";
  if(!text.trim()){ console.warn("Description text empty"); return; }
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = "GCMS_Analyzer_Description.txt";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
function openDescriptionInTab(){
  if(!DESCRIPTION_TEXT.trim()) return;
  const blob = new Blob([DESCRIPTION_TEXT], {type:"text/plain;charset=utf-8"});
  window.open(URL.createObjectURL(blob), "_blank");
}
function maybeAutoDownload(){
  try{
    if(sessionStorage.getItem("gcms_desc_auto_v1")==="1") return;
    sessionStorage.setItem("gcms_desc_auto_v1","1");
    setTimeout(downloadDescription, 600);
  }catch(e){ setTimeout(downloadDescription, 600); }
}

let state = {lang:"en",currentTab:"home",alkanes:JSON.parse(JSON.stringify(DEFAULT_ALKANES)),identRows:[],quantRows:[],sampleName:"Artemisia Judaica",analystName:AUTHOR_EN};
function loadState(){try{const s=localStorage.getItem("gcms_full_v1");if(s){const p=JSON.parse(s);state=Object.assign(state,p);if(!state.alkanes||!state.alkanes.length)state.alkanes=JSON.parse(JSON.stringify(DEFAULT_ALKANES));}}catch(e){}document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==="ar"?"rtl":"ltr";}
function saveState(){try{localStorage.setItem("gcms_full_v1",JSON.stringify({lang:state.lang,alkanes:state.alkanes,identRows:state.identRows,quantRows:state.quantRows,sampleName:state.sampleName,analystName:state.analystName}));}catch(e){}}
function t(k,p){let s=TXT[state.lang][k]||k;if(p)for(const[a,b]of Object.entries(p))s=s.replace(new RegExp(`\\{${a}\\}`,"g"),b);return s;}

function kriFromRT(rt,alkanes){if(!alkanes||alkanes.length<2)return null;const pts=[...alkanes].sort((a,b)=>a[1]-b[1]);if(rt<=pts[0][1]||rt>=pts[pts.length-1][1])return null;for(let i=0;i<pts.length-1;i++){const[c1,t1]=pts[i],[c2,t2]=pts[i+1];if(t1<=rt&&rt<=t2&&t2>t1){const kri=100*c1+100*(c2-c1)*((rt-t1)/(t2-t1));return{kri,c1,c2};}}return null;}
function matchPercent(kc,kr){if(kc==null||kr==null||kr===0)return null;return Math.max(0,100-Math.abs(kc-kr)*2);}
function bestMatch(kc,row){if(kc==null)return null;const keys=["DB-1","DB-5","PEG","Adams"],vals=[row[3],row[4],row[5],row[6]];let best=null;keys.forEach((k,i)=>{const m=matchPercent(kc,vals[i]);if(m==null)return;if(!best||m>best.match)best={key:k,val:vals[i],match:m};});return best;}
function findCanonical(name){if(!name)return null;const n=name.trim().toLowerCase();for(const r of REF_DB)if(r[0].toLowerCase()===n)return r;for(const r of REF_DB){const syns=SYNONYMS[r[0]]||[];for(const s of syns)if(s.toLowerCase()===n)return r;}return null;}
function searchRef(q){q=(q||"").trim().toLowerCase();if(!q)return[...REF_DB];const out=[],seen=new Set();for(const r of REF_DB){if(seen.has(r[0]))continue;if(r[0].toLowerCase().includes(q)||r[1].toLowerCase().includes(q)){out.push(r);seen.add(r[0]);continue;}const syns=SYNONYMS[r[0]]||[];for(const s of syns)if(s.toLowerCase().includes(q)){out.push(r);seen.add(r[0]);break;}}return out;}

function renderTabs(){const tabs=[["home","t_home","🏠"],["kri","t_kri","🧮"],["ak","t_ak","⛽"],["id","t_id","🔍"],["q","t_q","📊"],["ref","t_ref","📚"],["rep","t_rep","📄"],["desc","t_desc","📥"],["sop","t_sop","📖"]];const el=document.getElementById("tabs");el.innerHTML="";tabs.forEach(([k,l,i])=>{const b=document.createElement("button");b.className="tab"+(state.currentTab===k?" active":"");b.textContent=`${i} ${t(l)}`;b.onclick=()=>{state.currentTab=k;render();};el.appendChild(b);});}
function render(){renderHeader();renderTabs();const c=document.getElementById("content");c.innerHTML="";switch(state.currentTab){case"home":renderHome(c);break;case"kri":renderKRI(c);break;case"ak":renderAk(c);break;case"id":renderID(c);break;case"q":renderQ(c);break;case"ref":renderRef(c);break;case"rep":renderRep(c);break;case"desc":renderDesc(c);break;case"sop":renderSOP(c);break;}}

function renderKRI(c){c.innerHTML=`<h2 class="page-title">🧮 ${t("k_title")}</h2><p class="page-sub">${t("k_sub")}</p>
<div class="card"><div class="form-row"><label>${t("k_rt")}</label><input type="number" id="kriRT" step="any" inputmode="decimal" placeholder="14.4240"></div>
<button class="btn btn-primary" style="width:100%" onclick="calcKRI()">${t("k_calc")}</button>
<div class="kri-box"><div class="kri-value" id="kriVal">—</div><div class="kri-label">${t("k_result")}</div><div class="kri-detail" id="kriDet"></div></div></div>
<div class="card"><h3>⚡ ${t("k_batch")}</h3><textarea id="kriBatch" rows="6" placeholder="14.4240&#10;23.0246&#10;26.3730"></textarea>
<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="calcBatch()">${t("k_batchbtn")}</button>
<pre id="kriOut" style="background:var(--bg2);padding:10px;border-radius:6px;margin-top:10px;color:var(--accent);font-size:12px;white-space:pre-wrap"></pre></div>`;
document.getElementById("kriRT").addEventListener("keydown",e=>{if(e.key==="Enter")calcKRI();});}
function calcKRI(){const rt=parseFloat(document.getElementById("kriRT").value.trim().replace(",","."));const v=document.getElementById("kriVal"),d=document.getElementById("kriDet");if(isNaN(rt)){v.textContent="—";v.style.color="var(--err)";d.textContent=t("k_nofill");return;}const r=kriFromRT(rt,state.alkanes);if(!r){v.textContent="—";v.style.color="var(--err)";d.textContent=t("k_none");return;}v.textContent=r.kri.toFixed(1);v.style.color="var(--primary)";d.textContent=`${t("k_before")}: C${r.c1}  •  ${t("k_after")}: C${r.c2}`;}
function calcBatch(){const lines=document.getElementById("kriBatch").value.split("\n").map(x=>x.trim()).filter(x=>x);const out=[];for(const l of lines){const rt=parseFloat(l.replace(",","."));if(isNaN(rt)){out.push(`${l} → ?`);continue;}const r=kriFromRT(rt,state.alkanes);out.push(r?`${rt.toFixed(4)} → ${r.kri.toFixed(1)}`:`${rt.toFixed(4)} → —`);}document.getElementById("kriOut").textContent=out.join("\n");}

<div class="card"><h3>${t("ak_cnt")}: ${state.alkanes.length}</h3><div id="akList"></div></div>`;renderAkList();}
function renderAkList(){const w=document.getElementById("akList");if(!w)return;w.innerHTML="";const s=[...state.alkanes].sort((a,b)=>a[0]-b[0]);s.forEach(([c,rt])=>{const r=document.createElement("div");r.className="list-row";r.innerHTML=`<span class="name">C${c}</span><span class="val">${rt.toFixed(2)}</span><button class="del-btn" onclick="akDelete(${c})">×</button>`;w.appendChild(r);});}
function akAdd(){const c=parseFloat(document.getElementById("akC").value);const rt=parseFloat(document.getElementById("akRT").value.replace(",","."));if(isNaN(c)||isNaN(rt)){alert(t("need_rt"));return;}state.alkanes=state.alkanes.filter(a=>a[0]!==c);state.alkanes.push([c,rt]);saveState();renderAk(document.getElementById("content"));}
function akDelete(c){state.alkanes=state.alkanes.filter(a=>a[0]!==c);saveState();renderAkList();}
function akLoad(){state.alkanes=JSON.parse(JSON.stringify(DEFAULT_ALKANES));saveState();renderAk(document.getElementById("content"));}

function renderID(c){c.innerHTML=`<h2 class="page-title">🔍 ${t("i_title")}</h2><p class="page-sub">${t("i_sub")}</p>
<div class="card"><div class="form-row"><label>${t("i_name")}</label><input type="text" id="idName" placeholder="α-Pinene" list="compList"><datalist id="compList">${REF_DB.slice(0,200).map(r=>`<option value="${r[0]}">`).join("")}</datalist></div>
<div class="form-row"><label>${t("i_rt")}</label><input type="number" id="idRT" step="any" inputmode="decimal" placeholder="5.123"></div>
<div class="form-row"><label>${t("i_kril")}</label><input type="number" id="idKRIL" step="any" inputmode="decimal" placeholder="932.0"></div>
<div class="btn-row"><button class="btn btn-primary" onclick="idAdd()">${t("i_add")}</button>
<button class="btn btn-primary" onclick="idSuggest()">${t("i_from_db")}</button>
<button class="btn" onclick="idExample()">${t("i_example")}</button>
<button class="btn btn-danger" onclick="idClear()">${t("i_clear")}</button></div></div>
<div class="card"><h3 id="idSum"></h3><div class="table-wrap"><table><thead><tr><th>${t("ihn")}</th><th>${t("ihc")}</th><th>${t("ihrt")}</th><th>${t("ihkc")}</th><th>${t("ihl")}</th><th>${t("ihm")}</th><th>${t("ihr")}</th><th>${t("ihs")}</th></tr></thead><tbody id="idBody"></tbody></table></div></div>`;renderIDTable();}
function renderIDTable(){const tb=document.getElementById("idBody");if(!tb)return;tb.innerHTML="";let ok=0,tent=0,unk=0;state.identRows.forEach((r,i)=>{const res=kriFromRT(r.rt,state.alkanes);const kc=res?res.kri:null;const row=findCanonical(r.name);let refKey,refVal,mp;if(row&&kc!=null){const b=bestMatch(kc,row);refKey=b.key;refVal=b.val;mp=b.match;}else{mp=kc!=null?matchPercent(kc,r.kril):null;refKey="DB-5";refVal=r.kril;}const d=(kc!=null&&refVal!=null)?Math.abs(kc-refVal):null;let stat,tag;if(kc==null||mp==null){stat=t("i_unk");tag="tag-unk";unk++;}else if(mp>=80&&d<=10){stat="✓ "+t("i_ok");tag="tag-ok";ok++;}else if(mp>=60&&d<=20){stat="~ "+t("i_tent");tag="tag-tent";tent++;}else{stat="✗ "+t("i_unk");tag="tag-unk";unk++;}const tr=document.createElement("tr");tr.innerHTML=`<td>${i+1}</td><td style="text-align:start">${escapeHtml(r.name)}</td><td>${r.rt.toFixed(4)}</td><td>${kc!=null?kc.toFixed(1):"—"}</td><td>${refVal!=null?refVal.toFixed(1):"—"}</td><td>${mp!=null?mp.toFixed(1):"—"}</td><td>${refKey}</td><td><span class="${tag}">${stat}</span> <button class="del-btn" style="color:var(--err);background:transparent;border:none;font-size:16px;cursor:pointer;margin-inline-start:4px" onclick="idDelete(${i})">×</button></td>`;tb.appendChild(tr);});const s=document.getElementById("idSum");if(s)s.textContent=t("i_sum",{t:state.identRows.length,o:ok,p:tent,u:unk});}
function idAdd(){const n=document.getElementById("idName").value.trim();const rt=parseFloat(document.getElementById("idRT").value.trim().replace(",","."));if(!n||isNaN(rt)){alert(t("no_data"));return;}let kl=parseFloat((document.getElementById("idKRIL").value||"").replace(",","."));if(isNaN(kl))kl=null;if(kl==null){const res=kriFromRT(rt,state.alkanes);if(res)kl=res.kri;}state.identRows.push({name:n,rt:rt,kril:kl});document.getElementById("idName").value="";document.getElementById("idRT").value="";document.getElementById("idKRIL").value="";saveState();renderIDTable();}
function idDelete(i){state.identRows.splice(i,1);saveState();renderIDTable();}
function idClear(){if(!confirm(t("confirm_clear")))return;state.identRows=[];saveState();renderIDTable();}
function idExample(){state.identRows=[];for(const[n,rt,kl]of EXAMPLE_IDENT){const row=findCanonical(n);const res=kriFromRT(rt,state.alkanes);const kc=res?res.kri:null;if(row&&kc!=null){const b=bestMatch(kc,row);if(b){state.identRows.push({name:n,rt,kril:b.val});continue;}}state.identRows.push({name:n,rt,kril:kl});}saveState();renderIDTable();}
function idSuggest(){const q=document.getElementById("idName").value.trim();const rt=parseFloat(document.getElementById("idRT").value.trim().replace(",","."));const kc=!isNaN(rt)?kriFromRT(rt,state.alkanes):null;const kriVal=kc?kc.kri:null;const rows=searchRef(q).slice(0,50);window._suggestRows=rows;openModal(`<h3 style="color:var(--accent)">💡 ${t("i_from_db")}</h3>${kriVal!=null?`<div class="info-box">RT=${rt.toFixed(4)} → KRI=${kriVal.toFixed(1)}</div>`:`<div class="warn-box">${t("ref_nort")}</div>`}<div style="max-height:50vh;overflow-y:auto;margin-top:10px">${rows.map((r,idx)=>{const b=kriVal!=null?bestMatch(kriVal,r):null;const bestStr=b?`Best: ${b.match.toFixed(1)}% (${b.key})`:"";return `<div class="suggest-item" onclick="pickSuggestion(${idx})"><div class="name">${escapeHtml(r[0])}</div><div class="detail">CAS: ${r[1]} | KRI DB-5: ${r[4]??"—"} | ${bestStr}</div></div>`;}).join("")}</div><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">${t("cancel")}</button>`);}
function pickSuggestion(idx){const rows=window._suggestRows||[];if(!rows[idx])return;const r=rows[idx];document.getElementById("idName").value=r[0];document.getElementById("idKRIL").value=r[4]??"";closeModal();}

function renderQTable(){const tb=document.getElementById("qBody");if(!tb)return;tb.innerHTML="";const exS=document.getElementById("qExclS")?.checked;const exH=document.getElementById("qExclH")?.checked;let rows=state.quantRows.slice();if(exS)rows=rows.filter(r=>r.kri==null||r.kri>=800);if(exH)rows=rows.filter(r=>r.kri==null||r.kri<=2500);const total=rows.reduce((s,r)=>s+r.area,0)||1;rows.forEach((r,i)=>{const pct=(r.area/total)*100;const tr=document.createElement("tr");tr.innerHTML=`<td>${i+1}</td><td style="text-align:start">${escapeHtml(r.name)}</td><td>${r.area.toLocaleString()}</td><td>${pct.toFixed(2)}%</td><td>${r.kri!=null?Math.round(r.kri):"—"}</td>`;tb.appendChild(tr);});const s=document.getElementById("qSum");if(s)s.textContent=t("q_total",{t:Math.round(total).toLocaleString(),n:rows.length});}

function renderRefTable(){const tb=document.getElementById("refBody");if(!tb)return;const q=document.getElementById("refQ").value;const rows=searchRef(q);tb.innerHTML="";rows.forEach(r=>{const tr=document.createElement("tr");tr.innerHTML=`<td style="text-align:start">${escapeHtml(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]??"—"}</td><td>${r[4]??"—"}</td><td>${r[5]??"—"}</td><td>${r[6]??"—"}</td>`;tb.appendChild(tr);});document.getElementById("refCnt").textContent=t("ref_cnt",{n:rows.length,t:REF_DB.length});}

function renderRep(c){c.innerHTML=`<h2 class="page-title">📄 ${t("rep_title")}</h2>
<div class="card"><div class="form-row"><label>${t("rep_sample")}</label><input type="text" id="repSample" value="${escapeHtml(state.sampleName)}"></div>
<div class="form-row"><label>${t("rep_analyst")}</label><input type="text" id="repAnalyst" value="${escapeHtml(state.analystName)}"></div>
<div class="btn-row"><button class="btn btn-primary" onclick="repGen()">${t("rep_gen")}</button>
<button class="btn" onclick="repSave()">${t("rep_save")}</button>
<button class="btn" onclick="repCopy()">${t("rep_copy")}</button></div></div>
<pre class="report" id="repTxt"></pre>`;repGen();}
function buildReport(){const sample=document.getElementById("repSample")?.value||state.sampleName;const analyst=document.getElementById("repAnalyst")?.value||state.analystName;state.sampleName=sample;state.analystName=analyst;saveState();const sep="=".repeat(80);const L=[sep,"  GC-MS ESSENTIAL OIL ANALYSIS REPORT",sep];L.push(`  Author : ${AUTHOR_EN}`);L.push(`  Date   : ${new Date().toLocaleString()}`);L.push(`  Sample : ${sample}`);L.push(`  Analyst: ${analyst}`);L.push("");L.push("-".repeat(80));L.push("  1. GC-MS CONDITIONS");L.push("-".repeat(80));for(let i=1;i<=11;i++)L.push(`  ${t("c"+i).padEnd(28)}: ${t("c"+i+"v")}`);L.push("");L.push("-".repeat(80));L.push("  2. ALKANE STANDARD");L.push("-".repeat(80));L.push("  "+[...state.alkanes].sort((a,b)=>a[0]-b[0]).map(([c,rt])=>`C${c}:${rt.toFixed(2)}`).join("  "));L.push("");L.push("-".repeat(80));L.push("  3. IDENTIFICATION");L.push("-".repeat(80));L.push(`  ${"#".padEnd(4)}${"Compound".padEnd(26)}${"RT".padStart(10)}${"KRIc".padStart(9)}${"KRIref".padStart(9)}${"Match%".padStart(9)}${"Ref".padStart(7)}  Status`);state.identRows.forEach((r,i)=>{const res=kriFromRT(r.rt,state.alkanes);const kc=res?res.kri:null;const row=findCanonical(r.name);let refKey,refVal,mp;if(row&&kc!=null){const b=bestMatch(kc,row);refKey=b.key;refVal=b.val;mp=b.match;}else{mp=kc!=null?matchPercent(kc,r.kril):null;refKey="DB-5";refVal=r.kril;}const d=(kc!=null&&refVal!=null)?Math.abs(kc-refVal):null;let st="Unknown";if(kc!=null&&mp!=null){if(mp>=80&&d<=10)st="Identified";else if(mp>=60&&d<=20)st="Tentative";}L.push(`  ${String(i+1).padEnd(4)}${r.name.substring(0,25).padEnd(26)}${r.rt.toFixed(4).padStart(10)}${(kc!=null?kc.toFixed(1):"—").padStart(9)}${(refVal!=null?refVal.toFixed(1):"—").padStart(9)}${(mp!=null?mp.toFixed(1):"—").padStart(9)}${refKey.padStart(7)}  ${st}`);});L.push("");L.push("-".repeat(80));L.push("  4. QUANTIFICATION");L.push("-".repeat(80));const total=state.quantRows.reduce((s,r)=>s+r.area,0)||1;L.push(`  ${"#".padEnd(4)}${"Compound".padEnd(30)}${"Area".padStart(16)}${"%Area".padStart(11)}${"KRI".padStart(8)}`);state.quantRows.forEach((r,i)=>{const pct=(r.area/total)*100;L.push(`  ${String(i+1).padEnd(4)}${r.name.substring(0,29).padEnd(30)}${r.area.toLocaleString().padStart(16)}${pct.toFixed(2).padStart(11)}${(r.kri!=null?Math.round(r.kri):"—").toString().padStart(8)}`);});L.push("");L.push("-".repeat(80));L.push("  5. REFERENCES");L.push("-".repeat(80));L.push("  • Adams, R.P. (2017). ed. 4.1.");L.push("  • Babushok et al. (2011). J. Phys. Chem. Ref. Data, 40, 043101.");L.push("  • NIST WebBook");L.push("  • SOP DOI: "+SOP_DOI);L.push("");L.push(sep);L.push("  Match % formula: 100 − |KRI_calc − KRI_ref| × 2");L.push("  Acceptance: Match ≥ 80% AND |ΔKRI| ≤ 10");L.push(sep);return L.join("\n");}
function repGen(){const txt=buildReport();const el=document.getElementById("repTxt");if(el)el.textContent=txt;}
function repSave(){const txt=buildReport();const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,"_");a.download=`GCMS_report_${stamp}.txt`;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);}
function repCopy(){const txt=buildReport();navigator.clipboard.writeText(txt).then(()=>alert(t("copied"))).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);alert(t("copied"));});}

function copyDOI(){
  const write=()=>alert(t("sop_copied"));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(SOP_DOI).then(write).catch(fallback);
  }else{fallback();}
  function fallback(){const ta=document.createElement("textarea");ta.value=SOP_DOI;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);write();}
}

function openModal(html){closeModal();const bg=document.createElement("div");bg.id="modalBg";bg.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px";bg.innerHTML=`<div style="background:var(--card);border-radius:12px;padding:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--border)">${html}</div>`;bg.onclick=e=>{if(e.target===bg)closeModal();};document.body.appendChild(bg);}
function closeModal(){const bg=document.getElementById("modalBg");if(bg)bg.remove();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

document.getElementById("langSelect").addEventListener("change",e=>{state.lang=e.target.value;document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==="ar"?"rtl":"ltr";saveState();render();});
window.addEventListener("load",()=>{loadState();document.getElementById("langSelect").value=state.lang;render();maybeAutoDownload();});
