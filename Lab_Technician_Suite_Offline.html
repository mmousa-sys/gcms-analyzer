<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="منصة موحّدة لأدوات فني المختبر: مساعد المختبر، تحليل GC-MS، والتحقق من طرق HPLC.">
  <title>البرنامج الشامل لفني المختبر</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #0b1220;
      color: #e5edf7;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 82px;
      padding: 12px 20px;
      background: #111c2e;
      border-bottom: 1px solid #26354b;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 230px; }
    .brand-icon { font-size: 30px; }
    .brand h1 { margin: 0; font-size: 17px; }
    .brand p { margin: 4px 0 0; color: #9fb0c6; font-size: 12px; }
    .modules {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .module, .utility {
      border: 1px solid #34445c;
      border-radius: 8px;
      background: #17243a;
      color: #dce8f7;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 13px;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .module:hover, .utility:hover { border-color: #42c7b5; }
    .module[aria-current="page"] {
      background: #0e766e;
      border-color: #42c7b5;
      color: white;
    }
    .utility { font-size: 12px; padding: 9px 11px; }
    .workspace { flex: 1; min-height: 0; }
    iframe { display: block; width: 100%; height: calc(100vh - 82px); height: calc(100dvh - 82px); border: 0; background: #f0f4f8; }
    .standalone { font-size: 12px; padding: 9px 11px; }
    dialog {
      width: min(820px, calc(100% - 28px));
      max-height: min(85vh, 760px);
      padding: 0;
      color: #e5edf7;
      background: #111c2e;
      border: 1px solid #34445c;
      border-radius: 12px;
    }
    dialog::backdrop { background: rgb(3 8 18 / 75%); }
    .about-header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: #111c2e;
      border-bottom: 1px solid #34445c;
    }
    .about-header h2 { margin: 0; font-size: 17px; }
    .about-close {
      border: 1px solid #34445c;
      border-radius: 7px;
      padding: 6px 10px;
      color: inherit;
      background: #17243a;
      font: inherit;
      cursor: pointer;
    }
    .about-content { padding: 18px; line-height: 1.7; }
    .about-content h3 { margin: 18px 0 8px; color: #65d8ca; font-size: 15px; }
    .about-content h3:first-child { margin-top: 0; }
    .about-content p { margin: 8px 0; color: #c6d3e2; }
    .about-content ul { margin: 6px 0; padding-inline-start: 22px; color: #c6d3e2; }
    .about-content li { margin: 5px 0; }
    .about-content a { color: #7dd3fc; overflow-wrap: anywhere; }
    .about-content .about-note { padding: 10px 12px; background: #17243a; border-inline-start: 3px solid #42c7b5; border-radius: 6px; }
    @media (max-width: 760px) {
      .topbar { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
      .brand { flex: 1; min-width: 190px; }
      .brand h1 { font-size: 15px; }
      .modules { order: 3; flex-basis: 100%; }
      iframe { height: calc(100vh - 132px); height: calc(100dvh - 132px); }
      .about-content { padding: 14px; }
    }
  </style>
</head>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🧪</span>
        <div>
          <h1 id="pageTitle">البرنامج الشامل لفني المختبر</h1>
          <p id="pageSubtitle">منصة واحدة لأدوات التحليل والتحقق المخبري</p>
        </div>
      </div>
      <nav class="modules" aria-label="أدوات المختبر">
        <button class="module" type="button" data-module="lab" aria-current="page">🧪 مساعد فني المختبر</button>
        <button class="module" type="button" data-module="gcms">🔬 محلل GC-MS</button>
        <button class="module" type="button" data-module="hplc">📈 التحقق من HPLC</button>
      </nav>
      <button class="utility" id="aboutButton" type="button">ℹ️ عن البرنامج</button>
      <button class="utility" id="languageToggle" type="button" aria-label="Switch language">English</button>
    </header>
    <main class="workspace">
      <iframe id="appFrame" title="مساعد فني المختبرات الشامل" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>
  </div>

  <dialog id="aboutDialog" aria-labelledby="aboutTitle">

      <h2 id="aboutTitle"></h2>
      <button class="about-close" id="aboutClose" type="button"></button>
    </div>
    <div class="about-content" id="aboutContent"></div>
  </dialog>

      document.querySelector("nav").setAttribute("aria-label", text.navLabel);
      buttons.forEach((button, index) => { button.textContent = text.nav[index]; });
      document.getElementById("languageToggle").textContent = language === "ar" ? "English" : "???????";
      frame.title = text.names[buttons.findIndex(button => button.dataset.module === getCurrentModule())];
    }

    function getCurrentModule() {
      const requested = location.hash.slice(1);
      return modules.includes(requested) ? requested : "lab";
    }

    function decodeApp(value) {
      const bytes = Uint8Array.from(atob(value), character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function showModule() {
      const selected = getCurrentModule();
      if (frame.dataset.module !== selected) {
        frame.srcdoc = decodeApp(APPS[selected]);
        frame.dataset.module = selected;
      }
      buttons.forEach(button => {
        if (button.dataset.module === selected) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
      renderLanguage();
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => { location.hash = button.dataset.module; });
    });
    document.getElementById("languageToggle").addEventListener("click", () => {
      language = language === "ar" ? "en" : "ar";
      renderLanguage();
    });
    window.addEventListener("hashchange", showModule);
    showModule();
  </script>
