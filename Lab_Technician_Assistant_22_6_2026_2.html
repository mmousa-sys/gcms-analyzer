<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f4f8;--card:#fff;--sidebar:#0f172a;--sidebar-h:#1e293b;--primary:#0891b2;--primary2:#0e7490;--success:#16a34a;--danger:#dc2626;--warning:#ea580c;--gold:#f59e0b;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#cbd5e1}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;margin:0}
.sidebar{width:260px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;z-index:100;transition:transform .3s ease}
html[dir="ltr"] .sidebar{right:auto;left:0}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.logo{text-align:center;padding:14px 10px}
.logo .icon{font-size:40px}
.logo h1{font-size:12px;margin-top:6px;line-height:1.4}
.logo .sub{font-size:9px;color:var(--muted);font-style:italic}
.logo .badge{display:inline-block;background:#1e293b;color:var(--gold);padding:2px 8px;border-radius:10px;font-size:9px;margin-top:4px;font-weight:700}
.divider{height:1px;background:#1e293b;margin:4px 14px}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;background:transparent;color:var(--muted);border:none;cursor:pointer;font-size:12.5px;font-weight:600;transition:all .15s;text-align:inherit;width:100%;font-family:inherit;border-right:3px solid transparent}
html[dir="ltr"] .nav-btn{border-right:none;border-left:3px solid transparent}
.nav-btn:hover{background:var(--sidebar-h);color:var(--primary)}
.nav-btn.active{background:var(--sidebar-h);color:var(--primary);border-right-color:var(--primary)}
html[dir="ltr"] .nav-btn.active{border-left-color:var(--primary)}
.nav-btn .icon{font-size:15px}
.sidebar-bottom{margin-top:auto;padding:10px;border-top:1px solid #1e293b;background:var(--sidebar-h)}
.lang-title{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:4px}
.lang-btns{display:flex;gap:3px;flex-wrap:wrap}
.lang-btn{flex:1;padding:5px 8px;background:#0f172a;color:#cbd5e1;border:none;border-radius:4px;cursor:pointer;font-size:10.5px;font-weight:600;transition:.15s;font-family:inherit}
.lang-btn.active{background:var(--primary);color:#fff}
.author{text-align:center;font-size:8.5px;color:var(--gold);font-style:italic;margin-top:8px}
.main{flex:1;margin-right:260px;padding:16px;overflow-y:auto;height:100vh}
html[dir="ltr"] .main{margin-right:0;margin-left:260px}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--primary);border-radius:5px}
.page{display:none}
.page.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{color:var(--primary);font-size:16px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e0f2f1;display:flex;align-items:center;gap:8px}
.card h3{color:var(--primary);font-size:13px;margin:12px 0 8px}
label{display:block;font-weight:600;font-size:12.5px;margin:10px 0 4px;color:var(--text2)}
input[type="text"],input[type="number"],select,textarea{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:6px;font-family:Consolas,monospace;font-size:13px;background:#f8fafc;color:var(--text);transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff}
textarea{font-family:Consolas,monospace;resize:vertical}
button.calc{background:var(--primary);color:#fff;border:none;padding:10px 22px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;margin-top:12px;transition:.15s;font-family:inherit}
button.calc:hover{background:var(--primary2);transform:translateY(-1px)}
button.calc.gold{background:var(--gold)}
button.calc.gold:hover{background:#d97706}
button.calc.danger{background:var(--danger)}
button.calc.danger:hover{background:#b91c1c}
button.calc.muted{background:var(--muted)}
button.calc.muted:hover{background:var(--text2)}
.result{background:#ecfeff;border:2px solid var(--primary);border-radius:8px;padding:14px;margin-top:14px;font-family:Consolas,monospace;font-size:14px;color:var(--primary2);font-weight:700;min-height:42px;white-space:pre-wrap;line-height:1.6}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{transform:translateX(100%)}html[dir="ltr"] .sidebar{transform:translateX(-100%)}.main{margin:0}html[dir="ltr"] .main{margin-left:0}}
.result-box{background:#ecfeff;border:1px solid var(--primary);border-radius:6px;padding:8px 10px;min-height:52px}
.result-box .lbl{font-size:10px;color:var(--text2);font-weight:700;margin-bottom:2px}
.result-box .val{font-family:Consolas,monospace;font-size:13px;color:var(--primary2);font-weight:700;word-break:break-all}
.table-wrap{max-height:480px;overflow:auto;border:1px solid var(--border);border-radius:6px;background:#fff}
.table-wrap::-webkit-scrollbar{width:8px;height:8px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #e2e8f0}
th{background:var(--primary);color:#fff;position:sticky;top:0;z-index:2;font-size:11px}
tr:nth-child(even){background:#f8fafc}
tr:hover{background:#e0f2f1}
td:first-child{text-align:start}
.feature-card{background:#f1f5f9;border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:.2s;text-align:start}
.feature-card:hover{background:#e0f2f1;border-color:var(--primary);transform:translateY(-2px)}
.feature-card .title{color:var(--primary);font-weight:700;font-size:13px;margin-bottom:4px}
.feature-card .desc{color:var(--text2);font-size:11px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:12px;overflow-x:auto}
.tab-btn{padding:9px 14px;background:transparent;border:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--text2);border-bottom:3px solid transparent;transition:.15s;white-space:nowrap;font-family:inherit}
.tab-btn:hover{color:var(--primary);background:#f8fafc}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fade .25s}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge.ok{background:#064e3b;color:#86efac}
.badge.tent{background:#78350f;color:#fcd34d}
.badge.unk{background:#450a0a;color:#fca5a5}
.alert{padding:10px 14px;border-radius:6px;margin:10px 0;font-size:12.5px}
.alert-info{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
.alert-success{background:#dcfce7;color:#166534;border:1px solid #86efac}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.alert-warning{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.example-btn{padding:5px 10px;background:#e2e8f0;color:var(--text);border:none;border-radius:5px;cursor:pointer;font-size:10.5px;margin:2px;font-family:inherit;transition:.15s}
.example-btn:hover{background:var(--primary);color:#fff}
.hint{color:var(--muted);font-size:11px;font-style:italic;margin:4px 0}
.cls-MH{background:#10b981;color:#fff}.cls-MO{background:#06b6d4;color:#fff}
.cls-SH{background:#8b5cf6;color:#fff}.cls-SO{background:#ec4899;color:#fff}
.cls-DH{background:#0d9488;color:#fff}.cls-AR{background:#f59e0b;color:#fff}
.cls-AL{background:#ef4444;color:#fff}.cls-ES{background:#a855f7;color:#fff}
.cls-FA{background:#eab308;color:#fff}.cls-MS{background:#64748b;color:#fff}
.canvas-wrap{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;height:480px;position:relative}
.menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:18px;cursor:pointer}
html[dir="rtl"] .menu-toggle{left:auto;right:12px}
@media(max-width:900px){.menu-toggle{display:block}}
</style>
</head>

function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}
function stdev(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))}
function regression(x,y){const n=x.length,mx=mean(x),my=mean(y);let num=0,den=0;for(let i=0;i<n;i++){num+=(x[i]-mx)*(y[i]-my);den+=(x[i]-mx)**2}const s=den?num/den:0;return[s,my-s*mx]}
function r2value(x,y,s,b){const my=mean(y);let ssr=0,sst=0;for(let i=0;i<x.length;i++){const p=s*x[i]+b;ssr+=(y[i]-p)**2;sst+=(y[i]-my)**2}return sst?1-ssr/sst:0}

function parseFormula(f){f=f.trim();if(!f)throw new Error("Empty formula");const parts=f.split(/[·.*]/);let total=0;for(const part of parts){const m=part.match(/^(\d+)(.+)$/);const mult=m?parseInt(m[1]):1;const sub=m?m[2]:part;total+=mult*parseSimpleFormula(sub)}return total}
function parseSimpleFormula(f){let total=0,i=0;while(i<f.length){const c=f[i];if(c==="("){let d=1,j=i+1;while(j<f.length&&d>0){if(f[j]==="(")d++;else if(f[j]===")")d--;j++}const inner=f.slice(i+1,j-1);let k=j,nm="";while(k<f.length&&/\d/.test(f[k])){nm+=f[k];k++}total+=parseSimpleFormula(inner)*(nm?parseInt(nm):1);i=k}else if(/[A-Z]/.test(c)){let s=c;i++;while(i<f.length&&/[a-z]/.test(f[i])){s+=f[i];i++}let nm="";while(i<f.length&&/\d/.test(f[i])){nm+=f[i];i++}if(!AM[s])throw new Error("Unknown element: "+s);total+=AM[s]*(nm?parseInt(nm):1)}else i++}return total}

let opts="";
for(const f of funcs)opts+='<option value="'+f+'">'+t(f)+'</option>';

function calcStat(){
try{
const x=parseNums($id("statX").value);
const y=parseNums($id("statY").value);
const key=$id("statFunc").value;
if(!x.length&&key!=="count")throw new Error("No X data");
let r,s=0,b=0;
if(key==="mean")r=mean(x);
else if(key==="median"){const sx=[...x].sort((a,b)=>a-b);const n=sx.length;r=n%2?sx[(n-1)/2]:(sx[n/2-1]+sx[n/2])/2}
else if(key==="mode"){const freq={};x.forEach(v=>freq[v]=(freq[v]||0)+1);r=parseInt(Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0])}
else if(key==="stdev")r=stdev(x);
else if(key==="variance")r=stdev(x)**2;
else if(key==="min")r=Math.min(...x);
else if(key==="max")r=Math.max(...x);
else if(key==="sum")r=x.reduce((a,b)=>a+b,0);
else if(key==="count")r=x.length;
else if(key==="geomean")r=Math.pow(x.reduce((a,b)=>a*b,1),1/x.length);
else{
if(x.length!==y.length||x.length<2)throw new Error("X and Y same length ≥ 2");
[s,b]=regression(x,y);
if(key==="correl"||key==="r2_lbl"){
const n=x.length,mx=mean(x),my=mean(y);
let num=0,dx=0,dy=0;
for(let i=0;i<n;i++){num+=(x[i]-mx)*(y[i]-my);dx+=(x[i]-mx)**2;dy+=(y[i]-my)**2}
const rv=dx&&dy?num/Math.sqrt(dx*dy):0;
r=key==="correl"?rv:rv*rv;
}
else if(key==="slope")r=s;
else if(key==="intercept")r=b;
else if(key==="steyx")r=steyxFn(x,y,s,b);
else if(key==="regression"){$id("statResult").textContent="y = "+b.toFixed(4)+" + "+s.toFixed(4)+"x";lastSlope=s;lastIntercept=b;lastX=x;lastY=y;addHistory("Regression","y = "+b.toFixed(4)+" + "+s.toFixed(4)+"x");return}
else if(key==="ttest"){const vx=stdev(x)**2,vy=stdev(y)**2;r=(mean(x)-mean(y))/Math.sqrt(vx/x.length+vy/y.length||1)}
else if(key==="ftest"){const vx=stdev(x)**2,vy=stdev(y)**2;r=vy?vx/vy:0}
}
$id("statResult").textContent=fmt(r);
addHistory("Stat",key+": "+fmt(r));
if(["slope","intercept","steyx","regression","correl","r2_lbl"].includes(key)){lastSlope=s;lastIntercept=b;lastX=x;lastY=y}
}catch(e){alert("Error: "+e.message)}
}

function calcVal(){
try{
const x=parseNums($id("vConc").value),y=parseNums($id("vResp").value),blank=parseNums($id("vBlank").value);
if(x.length<3||x.length!==y.length)throw new Error("Need ≥3 X & Y of equal length");
const[s,b]=regression(x,y);
const r2v=r2value(x,y,s,b);
const r=Math.sqrt(Math.max(0,r2v));
const sy=steyxFn(x,y,s,b);
const sd=blank.length>=3?stdev(blank):sy;
const lod=s?3.3*sd/s:0,loq=s?10*sd/s:0;
const recs=x.map((xi,i)=>{const pred=s*xi+b;return pred?y[i]/pred*100:null}).filter(v=>v!==null);
const rec=recs.length?mean(recs):0;
const my=mean(y);
const rsd=my?stdev(y)/my*100:0;
const set=function(k,v){$id("vv-"+k).textContent=v};
set("v_slope",fmt(s));set("v_int",fmt(b));set("v_r2",r2v.toFixed(6));
set("v_r",r.toFixed(6));set("v_sy",fmt(sy));set("v_sd",fmt(sd));
set("v_lod",fmt(lod));set("v_loq",fmt(loq));
set("v_range",Math.min(...x)+" – "+Math.max(...x));
set("v_rec",rec.toFixed(2));set("v_rsd",rsd.toFixed(2));
lastSlope=s;lastIntercept=b;lastX=x;lastY=y;
addHistory("Validation","LOD="+fmt(lod)+", LOQ="+fmt(loq)+", R²="+r2v.toFixed(6));
}catch(e){alert("Error: "+e.message)}
}

tr.innerHTML='<td>'+r.t+'</td><td>'+r.cat+'</td><td style="text-align:start;">'+r.detail+'</td>';
tbody.appendChild(tr);
}
}
function exportHistory(){
if(!history.length){alert(t("hist_empty"));return}
const csv=[["Time","Category","Detail"]].concat(history.map(r=>[r.t,r.cat,r.detail])).map(row=>row.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="history_"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"")+".csv";
a.click();
URL.revokeObjectURL(url);
}
function clearHistory(){
if(!confirm(t("hist_confirm")))return;
history=[];
localStorage.removeItem("labAssistantHistory");
renderHistory();
}
function switchTab(btn,tabId){
const container=btn.parentElement.parentElement;
container.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
container.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
const target=$id(tabId);
if(target)target.classList.add("active");
}

];

for(let i=0;i<ACID_DB.length;i++){
const a=ACID_DB[i];
const name=LANG==="ar"?a.ar:a.en;
opts+='<option value="'+i+'">'+name+' — '+a.formula+' ('+a.pct+'%, d='+a.d+')</option>';
}
page.innerHTML=
'<div class="card">'+
'<div class="tabs">'+
'<button class="tab-btn active" data-tab="acid-prep" onclick="switchTab(this,\'acid-prep\')">⚗️ '+t("acid_prep_title")+'</button>'+
'<button class="tab-btn" data-tab="acid-conv" onclick="switchTab(this,\'acid-conv\')">🔄 '+t("acid_conv_title")+'</button>'+
'</div>'+
'<div class="tab-content active" id="acid-prep">'+
'<h2>⚗️ '+t("acid_prep_title")+'</h2>'+
'<div class="alert alert-warning">'+t("acid_warning")+'</div>'+
'<label>'+t("acid_select")+'</label>'+
'<select id="acidPrepSel" onchange="fillAcidProps(\'prep\')"><option value="-1">'+t("acid_custom")+'</option>'+opts+'</select>'+
'<div class="grid-4">'+
'<div><label>'+t("acid_mw")+'</label><input id="acidPrepMW" value="36.46"></div>'+
'<div><label>'+t("acid_density")+'</label><input id="acidPrepD" value="1.19"></div>'+
'<div><label>'+t("acid_pct_stock")+'</label><input id="acidPrepPct" value="37"></div>'+
'<div><label>'+t("acid_eq")+'</label><input id="acidPrepEq" value="1"></div>'+
'</div>'+
'<label>'+t("acid_conc_mode")+'</label>'+
'<div id="acidModes" style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0;"></div>'+
'<div class="grid-2">'+
'<div><label>'+t("acid_target")+'</label><input id="acidPrepTarget" value="1"></div>'+
'<div><label>'+t("acid_vol")+'</label><input id="acidPrepVol" value="500"></div>'+
'</div>'+
'<div id="acidFinalDBox" style="display:none;">'+
'<label>'+t("acid_density_final")+'</label>'+
'<input id="acidPrepFinalD" value="1.0">'+
'<div class="hint">'+t("acid_final_d_hint")+'</div>'+
'</div>'+
'<button class="calc" onclick="calcAcidPrep()">'+t("acid_calc")+'</button>'+

'</div>'+
'<div class="tab-content" id="acid-conv">'+
'<h2>🔄 '+t("acid_conv_title")+'</h2>'+
'<label>'+t("acid_select")+'</label>'+
'<select id="acidConvSel" onchange="fillAcidProps(\'conv\')"><option value="-1">'+t("acid_custom")+'</option>'+opts+'</select>'+
'<div class="grid-4">'+
'<div><label>'+t("acid_mw")+'</label><input id="acidConvMW" value="36.46"></div>'+
'<div><label>'+t("acid_density")+'</label><input id="acidConvD" value="1.19"></div>'+
'<div><label>'+t("acid_pct_stock")+'</label><input id="acidConvPct" value="37"></div>'+
'<div><label>'+t("acid_eq")+'</label><input id="acidConvEq" value="1"></div>'+
'</div>'+
'<div class="alert alert-info" style="margin-top:10px;font-family:Consolas,monospace;line-height:1.9;">'+
'💡 M = (10 × d × %w/w) / MW<br>💡 N = M × eq<br>💡 m = (1000 × %w/w) / [MW × (100 − %w/w)]<br>💡 % w/v = %w/w × d'+
'</div>'+
'<button class="calc" onclick="convAcid()">'+t("calc")+'</button>'+
'<div class="result" id="acidConvResult">—</div>'+
'</div>'+
'</div>';
const modes=[["M","acid_m_molar"],["m","acid_m_molal"],["N","acid_m_norm"],["pww","acid_m_pww"],["pwv","acid_m_pwv"],["ppm","acid_m_ppm"]];
const cont=$id("acidModes");
for(const m of modes){
const lbl=document.createElement("label");
lbl.style.cssText="display:inline-flex;align-items:center;gap:4px;font-weight:600;cursor:pointer;margin:0;padding:6px 10px;background:#f1f5f9;border-radius:5px;border:1px solid #cbd5e1;";
lbl.innerHTML='<input type="radio" name="acidPrepMode" value="'+m[0]+'"'+(m[0]==="M"?" checked":"")+' onchange="toggleAcidFinalD()"> '+t(m[1]);

function fillAcidProps(side){
const selId=side==="prep"?"acidPrepSel":"acidConvSel";
const mwId=side==="prep"?"acidPrepMW":"acidConvMW";
const dId=side==="prep"?"acidPrepD":"acidConvD";
const pctId=side==="prep"?"acidPrepPct":"acidConvPct";
const eqId=side==="prep"?"acidPrepEq":"acidConvEq";
const i=parseInt($id(selId).value);
if(i>=0&&ACID_DB[i]){
const a=ACID_DB[i];
$id(mwId).value=a.mw;
$id(dId).value=a.d;
$id(pctId).value=a.pct;
$id(eqId).value=a.eq;
}
}
function toggleAcidFinalD(){
const md=document.querySelector('input[name="acidPrepMode"]:checked').value;
$id("acidFinalDBox").style.display=(md==="pww")?"block":"none";
}
function convAcid(){
try{
const mw=pNum($id("acidConvMW").value),d=pNum($id("acidConvD").value),pct=pNum($id("acidConvPct").value),eq=pNum($id("acidConvEq").value)||1;
if(mw<=0||d<=0||pct<0||pct>100)throw new Error(t("acid_err_check"));
const M=(10*d*pct)/mw,N=M*eq,molal=(1000*pct)/(mw*(100-pct)),pwv=pct*d,ppm=pwv*1e4;
$id("acidConvResult").textContent=
"M  = (10 × "+d+" × "+pct+") / "+mw+" = "+M.toFixed(4)+" mol/L\n"+
"N  = "+M.toFixed(4)+" × "+eq+" = "+N.toFixed(4)+" eq/L\n"+
"m  = (1000 × "+pct+") / ("+mw+" × (100−"+pct+")) = "+molal.toFixed(4)+" mol/kg\n"+
"% w/v = "+pct+" × "+d+" = "+pwv.toFixed(3)+" g/100mL\n"+
"ppm = "+pwv.toFixed(3)+" × 10⁴ = "+ppm.toFixed(0)+" ppm";
addHistory("Acid conv","M="+M.toFixed(4)+", N="+N.toFixed(4)+", m="+molal.toFixed(4));
}catch(e){alert("Error: "+e.message)}
}
function calcAcidPrep(){
try{
const mw=pNum($id("acidPrepMW").value),d=pNum($id("acidPrepD").value),ps=pNum($id("acidPrepPct").value),eq=pNum($id("acidPrepEq").value)||1;
const mode=document.querySelector('input[name="acidPrepMode"]:checked').value;
const target=pNum($id("acidPrepTarget").value),vT=pNum($id("acidPrepVol").value);
if(mw<=0||d<=0||ps<=0||ps>100||target<=0||vT<=0)throw new Error(t("acid_err_pos"));
const Ms=(10*d*ps)/mw,Ns=Ms*eq,ms=(1000*ps)/(mw*(100-ps)),pwv_s=ps*d;
let massPure=0,moles=0,calc="";
if(mode==="M"){moles=(target*vT)/1000;massPure=moles*mw;calc="n = "+target+"×"+vT+"/1000 = "+moles.toFixed(6)+" mol\nm_pure = "+massPure.toFixed(4)+" g"}
else if(mode==="m"){moles=(target*vT)/(1000+target*mw);massPure=moles*mw;calc="n = "+target+"×"+vT+"/(1000+"+target+"×"+mw+") = "+moles.toFixed(6)+" mol\nm_pure = "+massPure.toFixed(4)+" g\nm_solvent ≈ "+(vT-massPure).toFixed(2)+" g"}
else if(mode==="N"){const e=(target*vT)/1000;moles=e/eq;massPure=moles*mw;calc="eq = "+target+"×"+vT+"/1000 = "+e.toFixed(6)+" mol\nn = "+e.toFixed(6)+"/"+eq+" = "+moles.toFixed(6)+" mol\nm_pure = "+massPure.toFixed(4)+" g"}
else if(mode==="pww"){const df=pNum($id("acidPrepFinalD").value)||1.0;const mT=vT*df;massPure=mT*target/100;moles=massPure/mw;calc="m_total = "+vT+"×"+df+" = "+mT.toFixed(2)+" g\nm_pure = "+mT.toFixed(2)+"×"+target+"/100 = "+massPure.toFixed(4)+" g"}
else if(mode==="pwv"){massPure=(target*vT)/100;moles=massPure/mw;calc="m_pure = "+target+"×"+vT+"/100 = "+massPure.toFixed(4)+" g"}
else{massPure=(target*vT)/1e6;moles=massPure/mw;calc="m_pure = "+target+"×"+vT+"/10⁶ = "+massPure.toFixed(6)+" g ("+(massPure*1000).toFixed(4)+" mg)"}
if(massPure<=0)throw new Error(t("acid_err_mass"));
const massStock=massPure/(ps/100),vS=massStock/d,vW=vT-vS;
if(vS>vT+1e-6)throw new Error(tf("acid_err_vol",{v:vS.toFixed(2),t:vT}));
const mL=mode==="pww"?"% w/w":mode==="pwv"?"% w/v":mode==="ppm"?"ppm":mode==="N"?"N":mode==="m"?"m":"M";
$id("acidPrepResult").textContent=
t("acid_stock_props")+"\n   M="+Ms.toFixed(4)+" | N="+Ns.toFixed(4)+" | m="+ms.toFixed(4)+"\n   % w/v = "+pwv_s.toFixed(3)+" g/100mL\n━━━━━━━━━━━━━━━━━━━━\n"+
tf("acid_target_in",{c:target,m:mL,v:vT})+"\n"+
calc+"\n"+
"━━━━━━━━━━━━━━━━━━━━\n"+
"✅ "+t("acid_vol_stock")+" = "+vS.toFixed(3)+" mL\n"+
"✅ "+t("acid_vol_water")+" ≈ "+Math.max(0,vW).toFixed(3)+" mL";
const r=$id("acidRecipe");r.style.display="block";
r.innerHTML=
"<strong>"+t("acid_recipe_hdr")+"</strong><br>"+
'<span style="font-size:15px;">1️⃣ '+tf("acid_r1",{v:vS.toFixed(3)})+'</span><br>'+
'<span style="font-size:15px;">2️⃣ '+tf("acid_r2",{w:Math.max(0,Math.floor(vW*0.7))})+'</span><br>'+
'<span style="font-size:15px;">3️⃣ '+tf("acid_r3",{v:vT})+'</span><br>'+
'<span style="color:#dc2626;font-weight:700;">'+t("acid_r_warn")+'</span>';
addHistory("Acid prep",mode+"="+target+", V="+vT+"mL → "+vS.toFixed(2)+"mL + "+Math.max(0,vW).toFixed(2)+"mL H₂O");
}catch(e){alert("Error: "+e.message)}
}
